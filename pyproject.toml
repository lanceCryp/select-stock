[project]
name = "select-stock"
version = "0.1.0"
description = "量化选股策略回测系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "akshare>=1.12.0",
    "backtrader>=1.9.78",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "baostock>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/select_stock"]
